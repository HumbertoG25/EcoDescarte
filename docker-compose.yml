services:
  db:
    image: postgres:16-alpine
    container_name: ecodescarte-db
    environment:
      POSTGRES_DB: ecodescarte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bkp_Script-banco-ecodescarte.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecodescarte"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ecodescarte-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/ecodescarte
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

volumes:
  postgres_data:
