<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>EcoDescarte - Login</title>
</h:head>
<h:body>
    <h2>Login - EcoDescarte</h2>
    
    <!-- Exibe mensagens de erro ou sucesso -->
    <h:messages globalOnly="false" style="color:red;" />
    
    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel for="email" value="E-mail:" />
            <h:inputText id="email" value="#{usuarioBean.usuario.email}" required="true" />

            <h:outputLabel for="senha" value="Senha:" />
            <h:inputSecret id="senha" value="#{usuarioBean.usuario.senha}" required="true" />
        </h:panelGrid>

        <br/>
        <h:commandButton value="Entrar" action="#{usuarioBean.logar}" />
    </h:form>

    <br/>
    <!-- Botão que direciona para a tela de cadastro -->
    <h:link value="Criar Nova Conta" outcome="cadastro" styleClass="btn" />

</h:body>
</html>
