<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><ui:insert name="titulo">EcoDescarte - Central Admin</ui:insert></title>
    <h:outputStylesheet library="css" name="style.css" />
</h:head>
<h:body>
    <div class="admin-layout">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <h:link outcome="/admin/painel.xhtml" styleClass="brand">
                <span class="brand-icon">&#9851;</span>
                <span><span class="brand-eco">Eco</span>Descarte</span>
            </h:link>

            <div class="admin-info">
                <strong>#{usuarioBean.usuarioLogado.nome}</strong><br/>
                #{usuarioBean.usuarioLogado.email}
            </div>

            <nav>
                <h:link value="Início (Painel)" outcome="/admin/painel.xhtml" />
                <h:link value="Usuários e Admins" outcome="/admin/usuarios.xhtml" />
                <h:link value="Equipamentos e Checklists" outcome="/admin/equipamentos.xhtml" />
                <h:link value="Pontos de Coleta" outcome="/admin/pontos.xhtml" />
            </nav>

            <div class="sidebar-footer">
                <h:link value="&#8592; Ver Página Principal" outcome="/index.xhtml" />
                <h:form>
                    <h:commandButton value="Sair (Logout)" action="#{usuarioBean.logout}" styleClass="btn-logout" />
                </h:form>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="admin-conteudo">
            <h:messages globalOnly="false" showSummary="true" showDetail="true"
                        styleClass="mensagens" infoClass="msg-sucesso" errorClass="msg-erro" />

            <ui:insert name="conteudo" />
        </main>
    </div>
</h:body>
</html>
