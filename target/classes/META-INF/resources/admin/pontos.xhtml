<ui:composition template="/admin/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="titulo">EcoDescarte - Pontos de Coleta</ui:define>

    <ui:define name="conteudo">
        <div class="card">
            <h2>Cadastrar Novo Ponto de Coleta</h2>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel for="nomeLocal" value="Nome do Local:" />
                    <h:inputText id="nomeLocal" value="#{adminPontoBean.novoPonto.nomeLocal}" required="true"
                                 requiredMessage="Informe o nome do local." styleClass="input-texto" />

                    <h:outputLabel for="endereco" value="Endereço:" />
                    <h:inputText id="endereco" value="#{adminPontoBean.novoPonto.endereco}" required="true"
                                 requiredMessage="Informe o endereço." styleClass="input-texto" />

                    <h:outputLabel for="bairro" value="Bairro:" />
                    <h:inputText id="bairro" value="#{adminPontoBean.novoPonto.bairro}" styleClass="input-texto" />

                    <h:outputLabel for="cidade" value="Cidade:" />
                    <h:inputText id="cidade" value="#{adminPontoBean.novoPonto.cidade}" required="true"
                                 requiredMessage="Informe a cidade." styleClass="input-texto" />

                    <h:outputLabel for="horario" value="Horário de Atendimento:" />
                    <h:inputText id="horario" value="#{adminPontoBean.novoPonto.horarioAtendimento}" styleClass="input-texto" />

                    <h:outputLabel for="ativo" value="Ponto Ativo?" />
                    <h:selectBooleanCheckbox id="ativo" value="#{adminPontoBean.novoPonto.ativo}" />

                    <h:outputLabel value="Equipamentos Aceitos:" />
                    <h:selectManyCheckbox value="#{adminPontoBean.equipamentosAceitosIds}"
                                          converter="jakarta.faces.Long"
                                          layout="pageDirection">
                        <f:selectItems value="#{adminPontoBean.equipamentosDisponiveis}"
                                       var="equip"
                                       itemLabel="#{equip.nome} (#{equip.categoria})"
                                       itemValue="#{equip.id}" />
                    </h:selectManyCheckbox>
                </h:panelGrid>

                <br/>
                <h:commandButton value="Cadastrar Ponto de Coleta"
                                 action="#{adminPontoBean.cadastrarPonto}"
                                 styleClass="btn-primario" />
            </h:form>
        </div>

        <div class="card">
            <h3>Pontos de Coleta Cadastrados</h3>
            <h:form>
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Local</th>
                            <th>Endereço</th>
                            <th>Bairro</th>
                            <th>Cidade</th>
                            <th>Horário</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ui:repeat value="#{adminPontoBean.pontosDeColeta}" var="ponto">
                            <tr>
                                <td>#{ponto.id}</td>
                                <td><strong>#{ponto.nomeLocal}</strong></td>
                                <td>#{ponto.endereco}</td>
                                <td>#{ponto.bairro}</td>
                                <td>#{ponto.cidade}</td>
                                <td>#{ponto.horarioAtendimento}</td>
                                <td>#{ponto.ativo ? 'Ativo' : 'Inativo'}</td>
                                <td>
                                    <h:commandButton value="Excluir"
                                                     action="#{adminPontoBean.deletarPonto(ponto.id)}"
                                                     onclick="return confirm('Deseja realmente excluir este ponto de coleta?');"
                                                     styleClass="btn-perigo" />
                                </td>
                            </tr>
                        </ui:repeat>
                    </tbody>
                </table>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
