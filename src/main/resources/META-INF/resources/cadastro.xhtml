<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>EcoDescarte - Cadastro</title>
</h:head>
<h:body>
    <h2>Cadastro de Novo Usuário</h2>
    
    <!-- Exibe mensagens de erro ou sucesso -->
    <h:messages globalOnly="false" showSummary="true" showDetail="true" style="color:red;" />
    
    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel for="nome" value="Nome Completo:" />
            <h:inputText id="nome" value="#{usuarioBean.usuario.nome}" required="true" />

            <h:outputLabel for="email" value="E-mail:" />
            <h:inputText id="email" value="#{usuarioBean.usuario.email}" required="true" />

            <h:outputLabel for="senha" value="Senha:" />
            <h:inputSecret id="senha" value="#{usuarioBean.usuario.senha}" required="true" />

            <h:outputLabel for="cidade" value="Cidade:" />
            <h:inputText id="cidade" value="#{usuarioBean.usuario.cidade}" />
        </h:panelGrid>

        <br/>
        <h:commandButton value="Cadastrar" action="#{usuarioBean.cadastrar}" />
        
        <br/><br/>
        <h:link value="Já tem uma conta? Faça login" outcome="login.xhtml" />
    </h:form>
</h:body>
</html>
