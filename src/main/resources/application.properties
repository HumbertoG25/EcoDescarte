spring.application.name=sistema-sla

# Porta do servidor: o Render define a variavel PORT; localmente usa 8080
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecodescarte}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cria/atualiza as tabelas automaticamente a partir das entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Economia de memória para o plano gratuito do Render (512 MB)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

joinfaces.faces.project-stage=Development
joinfaces.faces-servlet.url-mappings=*.xhtml
server.servlet.session.timeout=30m
spring.web.resources.cache.period=0
